version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aivideo
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage
      - MODEL_PATH=/app/models
      - JWT_SECRET=production-secret-min-32-chars-entropy
      - TEST_MODE=false
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aivideo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
