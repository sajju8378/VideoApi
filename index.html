<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Video Generator</title>
    <meta name="description" content="Self-hosted AI image-to-video generation platform with custom inference pipeline, queue management, and real-time video processing." />
    <meta property="og:title" content="AI Video Generator" />
    <meta property="og:description" content="Self-hosted AI image-to-video generation platform with custom inference pipeline, queue management, and real-time video processing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" crossorigin href="./assets/app-bundle.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Universal static fallback: if running on static host (e.g. GitHub Pages) where main.tsx is not compiled on-the-fly
      if (window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:') {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.children.length === 0)) {
            var bundleScript = document.createElement('script');
            bundleScript.type = 'module';
            bundleScript.crossOrigin = 'anonymous';
            bundleScript.src = './assets/app-bundle.js';
            document.body.appendChild(bundleScript);
          }
        }, 150);
      }
    </script>
  </body>
</html>
